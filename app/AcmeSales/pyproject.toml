[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "AcmeSales"
version = "0.1.0"
description = "Acme Telco Sales agent (AgentCore Runtime, Strands SDK) with HITL discount approval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro ~= 0.18.0",
    "bedrock-agentcore >= 1.9.1",
    "boto3>=1.43.118",
    "botocore[crt] >= 1.35.0",
    "mcp ~= 1.24.0",
    "pyjwt>=2.15.1",
    "requests>=2.34.2",
    "strands-agents >= 1.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
